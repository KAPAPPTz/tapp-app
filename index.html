<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAPP</title>
<style>
body{font-family:sans-serif;background:#f2f2f2;text-align:center;padding:20px}
.card{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 2px 10px rgba(0,0,0,.1)}
h1{color:#1877F2}
button{background:#1877F2;color:white;border:none;padding:12px 20px;border-radius:10px;font-size:16px;width:100%;margin-top:10px}
input{width:95%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ccc}
</style>
</head>
<body>
<div class="card">
<h1>TAPP 🔥</h1>
<p>Karibu kwenye App yako!</p>
<input id="jina" placeholder="Andika jina lako">
<button onclick="sema()">Bonyeza Hapa</button>
<p id="matokeo"></p>
</div>
<script>
function sema(){
let j=document.getElementById('jina').value;
document.getElementById('matokeo').innerText="Karibu sana, "+j+"! App yako inafanya kazi!";
}
</script>
</body>
</html>
